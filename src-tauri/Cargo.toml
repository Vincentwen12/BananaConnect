[package]
name = "banana-connect"
version = "0.1.0"
description = "BananaConnect · Minecraft 局域网联机工具"
authors = ["BananaConnect"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "banana_connect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = true
panic = "abort"
